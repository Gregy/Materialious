# Personal build of this fork: builds the Android app on every push to the `gregy` branch, signs it with
# the fork's own key and publishes it as a GitHub release (installable directly or tracked by Obtainium).
name: Build Android (gregy fork)

on:
  push:
    branches: [gregy]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gregy-android
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./materialious/android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install modules
        run: cd ../ && npm ci

      - name: Build android nodejs packages
        run: cd ../static/nodejsAndroid && npm ci

      - name: Build package
        run: cd ../ && npm run build && npm prune --omit=dev

      - name: Sync package
        run: cd ../ && npx cap sync

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"
          cache: "gradle"

      - name: Build APKs
        run: bash gradlew assembleRelease

      - name: Sign APKs
        env:
          KEYSTORE_B64: ${{ secrets.GREGY_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GREGY_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          mkdir -p "$RUNNER_TEMP/out"
          for abi in universal arm64-v8a; do
            "$apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 --ks-pass env:KEYSTORE_PASSWORD \
              --out "$RUNNER_TEMP/out/materialious-$abi.apk" "app/build/outputs/apk/release/app-$abi-release-unsigned.apk"
          done
          "$apksigner" verify --print-certs "$RUNNER_TEMP/out/materialious-universal.apk" | head -3
          rm -f "$RUNNER_TEMP/release.p12"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('../package.json').version")
          tag="v$version-gregy.${{ github.run_number }}"
          gh release create "$tag" "$RUNNER_TEMP"/out/*.apk --target "$GITHUB_SHA" --title "$tag" \
            --notes "Personal build of the \`gregy\` branch ($GITHUB_SHA): upstream $version plus the fork's fixes."
